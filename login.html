<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Inventory Hub | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto 1rem;
        }

        .login-container h1 { font-size: 1.6rem; font-weight: 700; color: var(--dark); margin-bottom: 0.25rem; }
        .subtitle { color: var(--secondary); margin-bottom: 1.75rem; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 1rem;
            width: 100%;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; 
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1a3c9e 100%);
            transform: translateY(-1px);
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-bottom: 1rem;
            color: var(--secondary);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .forgot-link:hover { color: var(--primary); }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="rtv logo.svg" alt="RTV Inventory Hub Logo" class="login-logo">
        <h1>RTV Inventory Hub</h1>
        <p class="subtitle">Sign in to manage district inventory</p>

        <div id="error-message" class="error-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" class="form-control" required style="padding-right:2.5rem;" autocomplete="current-password">
                    <span id="toggle-password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b;">
                        <i class="fa fa-eye"></i>
                    </span>
                </div>
            </div>
            <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
            <button type="submit" class="btn btn-primary" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if (loggedInUser) {
                window.location.href = loggedInUser.role === 'admin' ? 'index.html' : 'supervisor.html';
            }

            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMessage.style.display = 'none';
                
                const username = usernameInput.value.trim().toLowerCase();
                const password = passwordInput.value;

                // Show loading state
                const originalBtnText = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Signing in...';

                try {
                    const { error: connectionError } = await db.testConnection();
                    if (connectionError) {
                        showError(connectionError);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnText;
                        return;
                    }

                    // First check if it's an admin
                    const { data: admin, error: adminError } = await db.getAdminCredentials();
                    if (adminError) {
                        showError(adminError);
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnText;
                        return;
                    }
                    
                    if (!adminError && admin && username === admin.username && password === admin.password) {
                        sessionStorage.setItem('loggedInUser', JSON.stringify({ username: 'Admin', role: 'admin' }));
                        window.location.href = 'index.html';
                        return;
                    }
                    
                    // If not admin, check supervisor
                    const { data: user, error } = await db.login(username, password);
                    
                    if (!error && user && user.role === 'supervisor') {
                        sessionStorage.setItem('loggedInUser', JSON.stringify({
                            username: user.name,
                            role: 'supervisor',
                            district: user.district,
                            id: user.supervisorId
                        }));
                        window.location.href = 'supervisor.html';
                    } else {
                        showError(error || 'Invalid username or password. Please try again.');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnText;
                    }
                } catch (err) {
                    console.error('Login error:', err);
                    showError('An error occurred. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnText;
                }
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }

            document.getElementById('forgot-password-link').addEventListener('click', async (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim();
                if (username) {
                    await db.addNotification({
                        message: `Password reset requested for username: ${username}`,
                        type: 'password_reset',
                        read: false
                    });
                    alert('A password reset request has been sent to the administrator.');
                } else {
                    alert('Please enter your username first.');
                }
            });

            document.getElementById('toggle-password').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const icon = this.querySelector('i');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });

            // Allow Enter key to submit
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });
        });
    </script>
</body>
</html>
