<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTV Inventory Hub | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #64748b;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --transition: all 0.3s ease;
            --super-admin: #7c3aed;
            --super-admin-dark: #6d28d9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin: 0 auto 1rem;
        }

        .login-container h1 { font-size: 1.6rem; font-weight: 700; color: var(--dark); margin-bottom: 0.25rem; }
        .subtitle { color: var(--secondary); margin-bottom: 1.75rem; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-size: 1rem;
            width: 100%;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white; 
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1a3c9e 100%);
            transform: translateY(-1px);
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .info-message {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
            font-size: 0.9rem;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-bottom: 1rem;
            color: var(--secondary);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .forgot-link:hover { color: var(--primary); }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .role-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .role-admin { background: #dbeafe; color: #1e40af; }
        .role-supervisor { background: #d1fae5; color: #065f46; }
        .role-super-admin { background: #ede9fe; color: #5b21b6; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="rtv logo.svg" alt="RTV Inventory Hub Logo" class="login-logo">
        <h1>RTV Inventory Hub</h1>
        <p class="subtitle">Sign in to manage district inventory</p>

        <div id="error-message" class="error-message"></div>
        <div id="info-message" class="info-message"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" class="form-control" required style="padding-right:2.5rem;" autocomplete="current-password">
                    <span id="toggle-password" style="position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); cursor:pointer; color:#64748b;">
                        <i class="fa fa-eye"></i>
                    </span>
                </div>
            </div>
            <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
            <button type="submit" class="btn btn-primary" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
            <p style="font-size: 0.7rem; color: var(--secondary);">
                <i class="fas fa-shield-alt"></i> Secure login for authorized personnel only
            </p>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loggedInUser = JSON.parse(sessionStorage.getItem('loggedInUser'));
            if (loggedInUser) {
                // Redirect based on role
                if (loggedInUser.role === 'super_admin') {
                    window.location.href = 'super-admin.html';
                } else if (loggedInUser.role === 'admin') {
                    window.location.href = 'index.html';
                } else if (loggedInUser.role === 'supervisor') {
                    window.location.href = 'supervisor.html';
                } else {
                    window.location.href = 'login.html';
                }
            }

            const loginForm = document.getElementById('login-form');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');
            const infoMessage = document.getElementById('info-message');
            const loginBtn = document.getElementById('login-btn');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMessage.style.display = 'none';
                infoMessage.style.display = 'none';
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    showError('Please enter both username and password.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    return;
                }

                // Show loading state
                const originalBtnText = loginBtn.innerHTML;
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Signing in...';

                try {
                    // Test database connection
                    const { error: connectionError } = await db.testConnection();
                    if (connectionError) {
                        showError('Cannot connect to database. Please check your internet connection.');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = originalBtnText;
                        return;
                    }

                    // First check if it's a super admin
                    const { data: superAdmin, error: superAdminError } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('username', username)
                        .eq('password', password)
                        .eq('role', 'super_admin')
                        .maybeSingle();

                    if (!superAdminError && superAdmin) {
                        sessionStorage.setItem('loggedInUser', JSON.stringify({ 
                            username: superAdmin.username, 
                            role: 'super_admin',
                            id: superAdmin.id,
                            name: superAdmin.name
                        }));
                        showInfo('Redirecting to Super Admin Dashboard...');
                        setTimeout(() => {
                            window.location.href = 'super-admin.html';
                        }, 1000);
                        return;
                    }
                    
                    // Then check if it's an admin
                    const { data: admin, error: adminError } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('username', username)
                        .eq('password', password)
                        .eq('role', 'admin')
                        .maybeSingle();

                    if (!adminError && admin) {
                        sessionStorage.setItem('loggedInUser', JSON.stringify({ 
                            username: admin.username, 
                            role: 'admin',
                            id: admin.id,
                            name: admin.name
                        }));
                        showInfo('Redirecting to Admin Dashboard...');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                        return;
                    }
                    
                    // Then check if it's a supervisor
                    const { data: supervisorUser, error: supervisorError } = await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('username', username)
                        .eq('password', password)
                        .eq('role', 'supervisor')
                        .maybeSingle();

                    if (!supervisorError && supervisorUser) {
                        // Get supervisor details
                        const { data: supervisor } = await supabaseClient
                            .from('supervisors')
                            .select('district, id')
                            .eq('user_id', supervisorUser.id)
                            .maybeSingle();
                        
                        sessionStorage.setItem('loggedInUser', JSON.stringify({
                            username: supervisorUser.name || supervisorUser.username,
                            role: 'supervisor',
                            district: supervisor?.district || 'Unknown',
                            id: supervisor?.id,
                            user_id: supervisorUser.id
                        }));
                        showInfo('Redirecting to Supervisor Dashboard...');
                        setTimeout(() => {
                            window.location.href = 'supervisor.html';
                        }, 1000);
                        return;
                    }
                    
                    // If no user found
                    showError('Invalid username or password. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnText;
                    
                } catch (err) {
                    console.error('Login error:', err);
                    showError('An error occurred. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnText;
                }
            });

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 5000);
            }

            function showInfo(message) {
                infoMessage.textContent = message;
                infoMessage.style.display = 'block';
            }

            document.getElementById('forgot-password-link').addEventListener('click', async (e) => {
                e.preventDefault();
                const username = usernameInput.value.trim();
                if (username) {
                    try {
                        await db.addNotification({
                            message: `Password reset requested for username: ${username}`,
                            type: 'password_reset',
                            read: false
                        });
                        alert('A password reset request has been sent to the Super Administrator.');
                    } catch (err) {
                        alert('Please contact the system administrator for password reset.');
                    }
                } else {
                    alert('Please enter your username first.');
                }
            });

            document.getElementById('toggle-password').addEventListener('click', function() {
                const passwordField = document.getElementById('password');
                const icon = this.querySelector('i');
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    passwordField.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            });

            // Allow Enter key to submit
            usernameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') loginForm.dispatchEvent(new Event('submit'));
            });

            // Add demo credentials hint (only in development)
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('Development mode - Demo credentials:');
                console.log('  Super Admin: super_admin / super123');
                console.log('  Admin: admin / admin123');
                console.log('  Supervisor: Martin / password123');
            }
        });
    </script>
</body>
</html>
